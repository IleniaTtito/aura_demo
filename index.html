<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>aura</title>
<meta name="description" content="aura: convierte tus comentarios en tu próximo vídeo.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#F5F4FA}
input::placeholder{color:#7C7690}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #5B3FE0;outline-offset:2px}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div style="min-height: 820px; background: #F5F4FA; font-family: 'DM Sans', sans-serif; color: #1A1726">

  <sc-if value="{{is.inicio}}" hint-placeholder-val="{{ true }}">
    <div style="min-height: 820px; display: flex; flex-direction: column">
      <nav style="display: flex; justify-content: flex-end; align-items: center; gap: 24px; padding: 20px 32px; font-size: 15px">
        <sc-if value="{{loggedOut}}" hint-placeholder-val="{{ true }}">
          <button type="button" onClick="{{toLogin}}" style="height: 44px; padding: 0 18px; border: 1px solid #D8D3EC; border-radius: 999px; background: #FFFFFF; font: inherit; font-size: 15px; font-weight: 500; color: #5B3FE0; cursor: pointer">Login</button>
        </sc-if>
      </nav>

      <main style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px 20px 72px">
        <h1 style="margin: 0; font-size: 96px; font-weight: 500; letter-spacing: -3px; color: #5B3FE0; line-height: 1">aura</h1>
        <p style="margin: 14px 0 32px; font-size: 18px; color: #4F4A63; text-align: center">Convierte tus comentarios en tu próximo vídeo.</p>

        <div role="search" style="width: 100%; max-width: 640px">
          <div style="display: flex; align-items: center; gap: 8px; background: #FFFFFF; border: 1px solid #E3E1EC; border-radius: 999px; padding: 8px 8px 8px 24px">
            <label for="q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Tu usuario de TikTok</label>
            <input id="q" value="{{query}}" onChange="{{setQuery}}" onKeyDown="{{onKey}}" enterkeyhint="go" placeholder="Escribe tu usuario de TikTok" autocomplete="off" style="flex: 1; min-width: 0; border: 0; outline: none; font: inherit; font-size: 18px; color: #1A1726; background: transparent; height: 44px">
            <button type="button" onClick="{{analyze}}" style="height: 48px; padding: 0 26px; border: 0; border-radius: 999px; background: #5B3FE0; color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 500; cursor: pointer; white-space: nowrap">Ver ideas</button>
          </div>
        </div>

        <div style="display: flex; flex-wrap: wrap; gap: 12px; margin-top: 20px; width: 100%; max-width: 640px; text-align: left">
          <div style="flex: 1 1 190px; min-width: 0">
            <label for="f-goal" style="display: block; margin: 0 0 6px 16px; font-size: 13px; font-weight: 500; color: #4F4A63">Enfoque</label>
            <div style="position: relative">
              <select id="f-goal" value="{{goal}}" onChange="{{setGoal}}" style="width: 100%; height: 48px; padding: 0 40px 0 16px; border: 1px solid #E3E1EC; border-radius: 16px; background: #FFFFFF; font: inherit; font-size: 15px; color: #1A1726; appearance: none; -webkit-appearance: none; cursor: pointer; box-sizing: border-box">
                <option value="contenido">Contenido</option>
                <option value="comunidad">Comunidad</option>
              </select>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B6680" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; right: 16px; top: 16px; pointer-events: none"><path d="M6 9l6 6 6-6"/></svg>
            </div>
          </div>
          <div style="flex: 1 1 190px; min-width: 0">
            <label for="f-videos" style="display: block; margin: 0 0 6px 16px; font-size: 13px; font-weight: 500; color: #4F4A63">Analizar</label>
            <div style="position: relative">
              <select id="f-videos" value="{{vStr}}" onChange="{{setV}}" style="width: 100%; height: 48px; padding: 0 40px 0 16px; border: 1px solid #E3E1EC; border-radius: 16px; background: #FFFFFF; font: inherit; font-size: 15px; color: #1A1726; appearance: none; -webkit-appearance: none; cursor: pointer; box-sizing: border-box">
                <option value="3">Rápido (3 vídeos)</option>
                <option value="5">Normal (5 vídeos)</option>
                <option value="10">A fondo (10 vídeos)</option>
              </select>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B6680" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; right: 16px; top: 16px; pointer-events: none"><path d="M6 9l6 6 6-6"/></svg>
            </div>
          </div>
          <div style="flex: 1 1 190px; min-width: 0">
            <label for="f-periodo" style="display: block; margin: 0 0 6px 16px; font-size: 13px; font-weight: 500; color: #4F4A63">De</label>
            <div style="position: relative">
              <select id="f-periodo" value="{{dStr}}" onChange="{{setD}}" style="width: 100%; height: 48px; padding: 0 40px 0 16px; border: 1px solid #E3E1EC; border-radius: 16px; background: #FFFFFF; font: inherit; font-size: 15px; color: #1A1726; appearance: none; -webkit-appearance: none; cursor: pointer; box-sizing: border-box">
                <option value="7">La última semana</option>
                <option value="30">El último mes</option>
                <option value="90">Los últimos 3 meses</option>
              </select>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B6680" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; right: 16px; top: 16px; pointer-events: none"><path d="M6 9l6 6 6-6"/></svg>
            </div>
          </div>
        </div>
      </main>

      <footer style="display: flex; justify-content: center; gap: 24px; padding: 20px; font-size: 13px; color: #6B6680">
        <a href="#" style="color: #6B6680; text-decoration: none">Privacidad</a>
        <a href="#" style="color: #6B6680; text-decoration: none">Condiciones</a>
      </footer>
    </div>
  </sc-if>

  <sc-if value="{{is.entrar}}" hint-placeholder-val="{{ false }}">
    <div style="min-height: 820px; display: flex; flex-direction: column">
      <nav style="display: flex; align-items: center; padding: 20px 32px">
        <button type="button" onClick="{{toInicio}}" style="border: 0; background: transparent; padding: 4px 0; font: inherit; font-size: 28px; font-weight: 500; letter-spacing: -1px; color: #5B3FE0; cursor: pointer">aura</button>
      </nav>
      <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px 20px 96px">
        <div style="width: 100%; max-width: 420px; background: #FFFFFF; border: 1px solid #E3E1EC; border-radius: 24px; padding: 48px 32px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px; box-sizing: border-box">
          <h1 style="margin: 0; font-size: 32px; font-weight: 500; letter-spacing: -0.5px">Entra para analizar</h1>
          <p style="margin: 0 0 20px; font-size: 16px; line-height: 1.45; color: #6B6680">Con tu cuenta llevamos tus análisis del mes y los guardamos.</p>
          <button type="button" onClick="{{login}}" style="display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; height: 52px; border-radius: 999px; border: 1px solid #D8D3EC; background: #FFFFFF; color: #1A1726; font: inherit; font-size: 16px; font-weight: 500; cursor: pointer; box-sizing: border-box">
            <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5a5.6 5.6 0 0 1-2.4 3.6v3h3.9c2.3-2.1 3.5-5.2 3.5-8.8z"/><path fill="#34A853" d="M12 24c3.2 0 6-1.1 8-2.9l-3.9-3c-1.1.7-2.5 1.2-4.1 1.2-3.1 0-5.8-2.1-6.7-5H1.3v3.1A12 12 0 0 0 12 24z"/><path fill="#FBBC05" d="M5.3 14.3a7.2 7.2 0 0 1 0-4.6V6.6H1.3a12 12 0 0 0 0 10.8l4-3.1z"/><path fill="#EA4335" d="M12 4.8c1.8 0 3.3.6 4.6 1.8l3.4-3.4A12 12 0 0 0 1.3 6.6l4 3.1c.9-2.9 3.6-4.9 6.7-4.9z"/></svg>
            Continuar con Google
          </button>
          <p style="margin: 16px 0 0; font-size: 13px; color: #6B6680">Demo: no se conecta a tu cuenta real.</p>
        </div>
      </main>
      <footer style="display: flex; justify-content: center; gap: 24px; padding: 20px; font-size: 13px; color: #6B6680">
        <a href="#" style="color: #6B6680; text-decoration: none">Privacidad</a>
        <a href="#" style="color: #6B6680; text-decoration: none">Condiciones</a>
      </footer>
    </div>
  </sc-if>

  <sc-if value="{{is.analizando}}" hint-placeholder-val="{{ false }}">
    <div style="min-height: 820px">
      <header style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; padding: 16px 24px; background: #FFFFFF; border-bottom: 1px solid #E3E1EC">
        <button type="button" onClick="{{toInicio}}" style="border: 0; background: transparent; padding: 4px 0; font: inherit; font-size: 28px; font-weight: 500; letter-spacing: -1px; color: #5B3FE0; cursor: pointer">aura</button>
        <div role="search" style="flex: 1 1 280px; max-width: 560px; display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 4px 0 20px; border: 1px solid #E3E1EC; border-radius: 999px; background: #F5F4FA; box-sizing: border-box">
          <label for="q3" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Analizar otro usuario de TikTok</label>
          <input id="q3" value="{{topQuery}}" onChange="{{setTopQuery}}" onKeyDown="{{onKey}}" enterkeyhint="search" autocomplete="off" style="flex: 1; min-width: 0; border: 0; outline: none; font: inherit; font-size: 15px; color: #1A1726; background: transparent; height: 40px">
          <button type="button" onClick="{{analyze}}" aria-label="Nuevo análisis" title="Nuevo análisis" style="flex-shrink: 0; width: 40px; height: 40px; padding: 0; border: 0; border-radius: 999px; background: #5B3FE0; color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button>
        </div>
        <div style="margin-left: auto; display: flex; align-items: center">
          <sc-if value="{{loggedOut}}" hint-placeholder-val="{{ false }}">
            <button type="button" onClick="{{toLogin}}" style="height: 44px; padding: 0 18px; border: 1px solid #D8D3EC; border-radius: 999px; background: #FFFFFF; font: inherit; font-size: 15px; font-weight: 500; color: #5B3FE0; cursor: pointer">Login</button>
          </sc-if>
        </div>
      </header>

      <main style="max-width: 608px; margin: 0 auto; padding: 56px 24px; box-sizing: border-box">
        <h1 style="margin: 0; font-size: 40px; font-weight: 500; letter-spacing: -1px" aria-live="polite">{{an.title}}</h1>
        <p style="margin: 8px 0 28px; font-size: 16px; color: #6B6680">{{an.subtitle}}</p>
        <div style="max-width: 560px">
          <section aria-label="Avance">
            <ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px">
              <sc-for list="{{an.steps}}" as="s" hint-placeholder-count="3">
                <li style="{{s.row}}">
                  <span style="display: flex; align-items: center; gap: 12px"><span style="{{s.dot}}">{{s.mark}}</span>{{s.label}}</span>
                  <span style="{{s.metaStyle}}">{{s.meta}}</span>
                </li>
              </sc-for>
            </ol>
          </section>
        </div>
      </main>
    </div>
  </sc-if>

  <sc-if value="{{is.reporte}}" hint-placeholder-val="{{ false }}">
    <div>
      <header style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; padding: 16px 24px; background: #FFFFFF; border-bottom: 1px solid #E3E1EC">
        <button type="button" onClick="{{toInicio}}" style="border: 0; background: transparent; padding: 4px 0; font: inherit; font-size: 28px; font-weight: 500; letter-spacing: -1px; color: #5B3FE0; cursor: pointer">aura</button>
        <div role="search" style="flex: 1 1 280px; max-width: 560px; margin-left: auto; display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 4px 0 20px; border: 1px solid #E3E1EC; border-radius: 999px; background: #F5F4FA; box-sizing: border-box">
          <label for="q2" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Analizar otro usuario de TikTok</label>
          <input id="q2" value="{{topQuery}}" onChange="{{setTopQuery}}" onKeyDown="{{onKey}}" enterkeyhint="search" autocomplete="off" style="flex: 1; min-width: 0; border: 0; outline: none; font: inherit; font-size: 15px; color: #1A1726; background: transparent; height: 40px">
          <button type="button" onClick="{{analyze}}" aria-label="Nuevo análisis" title="Nuevo análisis" style="flex-shrink: 0; width: 40px; height: 40px; padding: 0; border: 0; border-radius: 999px; background: #5B3FE0; color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button>
        </div>
        <div style="display: flex; align-items: center">
          <sc-if value="{{loggedOut}}" hint-placeholder-val="{{ true }}">
            <button type="button" onClick="{{toLogin}}" style="height: 44px; padding: 0 18px; border: 1px solid #D8D3EC; border-radius: 999px; background: #FFFFFF; font: inherit; font-size: 15px; font-weight: 500; color: #5B3FE0; cursor: pointer">Login</button>
          </sc-if>
        </div>
      </header>

      <div style="max-width: 1180px; margin: 0 auto; padding: 32px 24px 64px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px">

        <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px 20px">
          <div style="min-width: 0">
            <h1 style="margin: 0; font-size: 40px; font-weight: 700; letter-spacing: -1.2px; line-height: 1.05"><button type="button" onClick="{{toPerfil}}" title="Ver tu perfil" style="border: 0; background: transparent; padding: 0; font: inherit; color: inherit; letter-spacing: inherit; cursor: pointer; text-align: left">@quieromak1s</button></h1>
            <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 12px">
              <button type="button" onClick="{{toPerfil}}" title="Ver tu perfil" style="font-size: 14px; font-weight: 500; padding: 0 14px; height: 36px; border: 0; border-radius: 999px; background: #EAE6FB; color: #4128B8; font-family: inherit; cursor: pointer">Lifestyle</button>
              <button type="button" onClick="{{toPerfil}}" title="Ver tu perfil" style="font-size: 14px; font-weight: 500; padding: 0 14px; height: 36px; border: 0; border-radius: 999px; background: #EAE6FB; color: #4128B8; font-family: inherit; cursor: pointer">Micro Influencer</button>
              <button type="button" onClick="{{toPerfil}}" style="border: 0; background: transparent; font: inherit; font-size: 14px; color: #5B3FE0; cursor: pointer; padding: 12px 6px">Ver tu perfil →</button>
            </div>
          </div>
          <div role="radiogroup" aria-label="Enfoque" style="display: flex; flex-wrap: wrap; gap: 8px">
            <sc-for list="{{focus}}" as="f" hint-placeholder-count="2">
              <button type="button" role="radio" aria-checked="{{f.on}}" onClick="{{f.pick}}" style="{{f.style}}">{{f.label}}</button>
            </sc-for>
          </div>
        </div>

        <section aria-labelledby="mov" style="background: #EAE6FB; border-radius: 28px; padding: 24px 24px 12px">
          <h2 id="mov" style="margin: 0 0 14px; font-size: 20px; font-weight: 700">{{actionsTitle}}</h2>
          <ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
            <sc-for list="{{moves}}" as="m" hint-placeholder-count="3">
              <li>
                <button type="button" onClick="{{m.toggle}}" aria-pressed="{{m.doneStr}}" style="{{m.style}}">
                  <span aria-hidden="true" style="flex-shrink: 0; width: 32px; height: 32px; border-radius: 999px; background: #EAE6FB; color: #4128B8; display: inline-flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700">{{m.n}}</span>
                  <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
                    <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.6px; color: #5B3FE0">{{m.verb}}</span>
                    <span style="font-size: 17px; font-weight: 500; line-height: 1.3">{{m.text}}</span>
                    <span style="font-size: 13px; line-height: 1.4; color: #4F4A63">{{m.why}}</span>
                  </span>
                  <span style="{{m.box}}">{{m.check}}</span>
                </button>
              </li>
            </sc-for>
          </ol>
          <button type="button" onClick="{{toggleHow}}" aria-expanded="{{howStr}}" aria-controls="como" style="display: inline-flex; align-items: center; gap: 8px; margin-top: 4px; border: 0; background: transparent; font: inherit; font-size: 14px; font-weight: 500; color: #4128B8; cursor: pointer; padding: 12px 0">¿De dónde sale esto? <span aria-hidden="true">{{howMark}}</span></button>
          <sc-if value="{{how}}" hint-placeholder-val="{{ false }}">
            <p id="como" style="margin: 0 0 12px; padding: 16px 20px; border-radius: 16px; background: #FFFFFF; font-size: 14px; line-height: 1.5; color: #4F4A63">{{howText}}</p>
          </sc-if>
        </section>

        <section aria-labelledby="hallazgos" style="background: #FFFFFF; border-radius: 28px; padding: 24px">
          <h2 id="hallazgos" style="margin: 0 0 14px; font-size: 20px; font-weight: 700">Lo que encontramos</h2>
          <sc-if value="{{isContenido}}" hint-placeholder-val="{{ true }}">
            <div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: stretch">
              <div style="flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 12px; padding: 20px; border-radius: 20px; background: #F5F4FA; box-sizing: border-box">
                <p style="margin: 0; font-size: 12px; font-weight: 700; letter-spacing: 0.6px; color: #4128B8">TENDENCIA</p>
                <p style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.6px; line-height: 1.1">−38%</p>
                <p style="margin: -6px 0 0; font-size: 14px; line-height: 1.4; color: #4F4A63">en tus últimos 5 vídeos, frente a los 5 anteriores</p>
                <div style="flex: 1; min-height: 72px; display: flex; align-items: flex-end; gap: 4px" role="img" aria-label="Vistas de tus últimos 5 vídeos frente a los 5 anteriores: bajaron 38%">
                  <sc-for list="{{trend}}" as="v" hint-placeholder-count="10">
                    <div onMouseEnter="{{v.enter}}" onMouseLeave="{{leave}}" onClick="{{v.enter}}" style="position: relative; flex: 1; height: 100%; display: flex; align-items: flex-end; cursor: default">
                      <sc-if value="{{v.show}}" hint-placeholder-val="{{ false }}"><span role="tooltip" style="position: absolute; left: 50%; bottom: 100%; transform: translateX(-50%); margin-bottom: 6px; padding: 6px 10px; border-radius: 8px; background: #1A1726; color: #FFFFFF; font-size: 12px; font-weight: 500; white-space: nowrap; z-index: 5; pointer-events: none">{{v.tip}}</span></sc-if>
                      <div style="{{v.bar}}"></div>
                    </div>
                  </sc-for>
                </div>
                <p style="margin: 0; display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: #6B6680"><span style="display: inline-flex; align-items: center; gap: 6px"><span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 3px; background: #DCD8EA"></span>5 anteriores</span><span style="display: inline-flex; align-items: center; gap: 6px"><span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 3px; background: #5B3FE0"></span>Últimos 5</span></p>
              </div>
              <div style="flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 12px; padding: 20px; border-radius: 20px; background: #F5F4FA; box-sizing: border-box">
                <p style="margin: 0; font-size: 12px; font-weight: 700; letter-spacing: 0.6px; color: #4128B8">QUÉ TE FUNCIONA</p>
                <div style="display: flex; flex-direction: column; gap: 12px">
                  <sc-for list="{{themes}}" as="r" hint-placeholder-count="3">
                    <div onMouseEnter="{{r.enter}}" onMouseLeave="{{leave}}" onClick="{{r.enter}}" style="position: relative; cursor: default">
                      <sc-if value="{{r.show}}" hint-placeholder-val="{{ false }}"><span role="tooltip" style="position: absolute; right: 0; bottom: 100%; margin-bottom: 6px; padding: 6px 10px; border-radius: 8px; background: #1A1726; color: #FFFFFF; font-size: 12px; font-weight: 500; white-space: nowrap; z-index: 5; pointer-events: none">{{r.tip}}</span></sc-if>
                      <div style="display: flex; justify-content: space-between; gap: 12px; font-size: 14px; line-height: 1.3"><span>{{r.label}}</span><span style="flex-shrink: 0; font-weight: 700; color: #4128B8">{{r.value}}</span></div>
                      <div style="margin-top: 6px; height: 8px; border-radius: 999px; background: #E3E1EC; overflow: hidden"><div style="{{r.bar}}"></div></div>
                    </div>
                  </sc-for>
                </div>
                <p style="margin: 0; font-size: 12px; color: #6B6680">% de tus vistas por tema</p>
              </div>
              <div style="flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 12px; padding: 20px; border-radius: 20px; background: #F5F4FA; box-sizing: border-box">
                <p style="margin: 0; font-size: 12px; font-weight: 700; letter-spacing: 0.6px; color: #4128B8">CUÁNDO PUBLICAR</p>
                <p style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.6px; line-height: 1.1">Jueves</p>
                <p style="margin: -6px 0 0; font-size: 14px; line-height: 1.4; color: #4F4A63">casi 4 veces más vistas que otro día</p>
                <div style="flex: 1; min-height: 64px; display: flex; align-items: flex-end; gap: 6px" role="img" aria-label="Vistas por día de la semana: el jueves es el más alto">
                  <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
